<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>子弹倒卖助手 - 静态网页版</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="container">
    <section class="summary-grid">
      <article class="summary-card">
        <span>总收益</span>
        <strong id="sum-profit">0</strong>
      </article>
      <article class="summary-card">
        <span>总库存花费</span>
        <strong id="sum-inventory-cost">0</strong>
      </article>
      <article class="summary-card">
        <span>总子弹数量</span>
        <strong id="sum-inventory">0</strong>
      </article>
    </section>

    <section class="panel controls">
      <div class="control-card">
        <h2>买入</h2>
        <form id="buy-form" class="form-grid">
          <label>子弹名称
            <select id="buy-name" required></select>
          </label>
          <label>买入单价
            <input id="buy-price" type="number" step="0.01" min="0" required>
          </label>
          <label>买入数量
            <input id="buy-qty" type="number" min="1" required>
          </label>
          <button class="btn btn-primary" type="submit">记录买入</button>
        </form>
      </div>

      <div class="control-card">
        <h2>卖出</h2>
        <form id="sell-form" class="form-grid">
          <label>子弹名称（仅库存>0）
            <select id="sell-name" required></select>
          </label>
          <label>卖出单价
            <input id="sell-price" type="number" step="0.01" min="0" required>
          </label>
          <label>卖出数量
            <input id="sell-qty" type="number" min="1" required>
          </label>
          <button class="btn btn-primary" type="submit">记录卖出</button>
        </form>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title-row">
        <h2>持仓卡片（按标签优先 + 最近买入时间）</h2>
      </div>
      <div id="holdings" class="holdings"></div>
    </section>
  </div>
  <script src="./shared.js"></script>
  <script src="./index.js"></script>
</body>
</html>
