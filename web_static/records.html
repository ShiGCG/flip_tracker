<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>买卖记录管理</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="container">
    <section class="panel">
      <div class="panel-title-row">
        <h2>买卖记录（新日期在上）</h2>
      </div>
      <div class="table-wrap">
        <table class="data-table" id="records-table">
          <thead>
            <tr>
              <th>时间</th>
              <th>类型</th>
              <th>名称</th>
              <th>等级</th>
              <th>数量</th>
              <th>单价</th>
              <th>总价</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>
  <script src="./shared.js"></script>
  <script src="./records.js"></script>
</body>
</html>
