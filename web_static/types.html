<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>子弹类型管理</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="container">
    <section class="panel">
      <div class="panel-title-row">
        <h2>子弹类型管理</h2>
      </div>
      <form id="type-form" class="form-inline">
        <input id="type-name" type="text" placeholder="名称（如 7.62 BP）" required>
        <input id="type-level" type="number" min="1" placeholder="等级" required>
        <input id="type-ratio" type="number" step="0.0001" min="0.0001" max="1" placeholder="回本系数(0~1)" required>
        <select id="type-tag">
          <option value="日抛">日抛</option>
          <option value="周抛">周抛</option>
          <option value="长期" selected>长期</option>
          <option value="赛季">赛季</option>
        </select>
        <button class="btn" type="submit">新增 / 更新</button>
      </form>
      <div id="type-list" class="type-list"></div>
    </section>
  </div>
  <script src="./shared.js"></script>
  <script src="./types.js"></script>
</body>
</html>
